<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пригласительная открытка</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-3.css">
</head>
<body>

    <div class="card-container" onclick="this.classList.toggle('flipped')">
        <div class="card">
            <!-- Лицевая сторона -->
            <div class="side front">
                <div class="border-design"></div>
                <div class="main-label">
                    <h1>7</h1>
                    <p>МАЯ</p>
                </div>
                <span class="tap-hint">нажми, чтобы открыть</span>
            </div>

            <!-- Обратная сторона -->
            <div class="side back">
                <div class="content">
                    <h2>Приглашение</h2>
                    <div class="line"></div>
                    <p class="invite-text">«7 мамыр — Отан қорғаушылар күніне орай ұйымдастырылған мерекелік кешіміздің сыйлы қонағы бол! Сені көруге асықпыз!»</p>
                    <div class="details">
                        <p><strong>Күні:</strong> 11.05.26</p>
                        <p><strong>Уақыты:</strong> 17:00</p>
                        <p><strong>Орны:</strong> байылдыр 13</p>
                    </div>
                    <div class="line"></div>
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
